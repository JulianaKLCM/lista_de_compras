<header>
  <div id="logo">
    <a routerLink="">
      <fa-icon [icon]="faCartShopping"></fa-icon>
    </a>
  </div>

  <nav *ngIf="isUserLoggedIn">
    <a routerLink="" id="lista-compras">Lista de Compras</a>
    <a routerLink="sobre" id="sobre">Sobre</a> <span id="separador">|</span>

    <span id="user-info">
      Usuário(a): {{ userName }}
    </span>

    <button id="sign-out" (click)="signOut()">Sair</button>
  </nav>
</header>
